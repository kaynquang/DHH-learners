# Run from the repository root:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Nothing is published on the host's ports: the only way in is the Cloudflare Tunnel (service "tunnel"), and the tunnel's hostnames sit behind Cloudflare Access.
services:
  learner:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    environment:
      SEESOUND_ADMIN_URL: ${SEESOUND_ADMIN_URL:-https://admin.seesound.org}
    volumes: [ "../data:/data", "../model:/model:ro" ]
  dev:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    volumes: [ "../data:/data", "../model:/model:ro" ]
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [learner, dev]
